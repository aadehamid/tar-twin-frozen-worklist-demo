<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Graph panel spike: Relate in the browser</title>
<style>
  :root { --ink: #1d2733; --muted: #5b6875; --line: #d7dde3; --bg: #f7f8fa; --accent: #0b5cad; }
  body { font: 15px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); margin: 0; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  section { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  pre { background: #f1f3f5; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; margin: 0 4px 4px 0; font-family: ui-monospace, monospace; font-size: 13px; }
  #status { margin-top: 8px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>WR-200-0147 in the plant graph</h1>
  <div class="muted">Sheet 200-PID-002, seeded into Relate WebAssembly in a worker. Synthetic data.</div>
  <div id="status" class="muted">Loading the engine and the plant script.</div>
  <div class="grid">
    <section><h2>Chain from the request</h2><dl id="chain"></dl><pre id="q-chain"></pre></section>
    <section><h2>Live isolation walk from the equipment</h2><dl id="walk"></dl><pre id="q-walk"></pre></section>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
