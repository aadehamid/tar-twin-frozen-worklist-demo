[project]
name = "tar-twin-backend"
version = "0.1.0"
description = "Unit 200 turnaround digital twin service (plant graph, sync, matching, clusters, baseline, KPIs)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "pydexpi==2.1.0",
  "lxml>=5.3.0",
  "pyshacl>=0.26.0",
  "rdflib>=7.0.0",
  "neo4j>=5.26.0",
  "rapidfuzz>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twin"]
