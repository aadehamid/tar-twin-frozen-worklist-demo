name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Relate
        run: |
          curl -sSfL https://relatedb.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run check script
        run: bash scripts/check.sh

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build IMPACT Web frontend
        working-directory: apps/impactweb/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Twin frontend
        working-directory: apps/twin/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push IMPACT Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/impactweb/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tar-twin-impactweb:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tar-twin-impactweb:main
            ghcr.io/${{ github.repository_owner }}/tar-twin-impactweb:latest

      - name: Build and push Twin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/twin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tar-twin-twin:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tar-twin-twin:main
            ghcr.io/${{ github.repository_owner }}/tar-twin-twin:latest

      - name: Build and push Neo4j image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/neo4j/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tar-twin-neo4j:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tar-twin-neo4j:main
            ghcr.io/${{ github.repository_owner }}/tar-twin-neo4j:latest
